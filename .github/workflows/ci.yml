name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Test
        run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Integration tests with --coverage
        run: node --experimental-test-coverage --test tests/integration/import-export-roundtrip.test.js

  validate-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            deps
            ci
            style
            perf
          requireScope: false

  validate-branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|docs|chore|refactor|test|deps)/"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == "develop" ]]; then
            echo "Default branch — skipping validation"
            exit 0
          fi
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Invalid branch name: $BRANCH"
            echo "Branch must match: feat/, fix/, docs/, chore/, refactor/, test/, deps/"
            exit 1
          fi
          echo "Branch name valid: $BRANCH"

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Iron Dome — any usage
        run: node scripts/governance/check-any-usage.js
      - name: Iron Dome — silent catches
        run: node scripts/governance/check-silent-catches.js
      - name: Escape Hatch — eslint-disable
        run: node scripts/governance/check-eslint-disable.js
      - name: Rising Tide — Mock Tax
        run: node scripts/governance/check-mock-tax.js
      - name: Adversarial Mock Scan
        run: node scripts/governance/check-adversarial-mocks.js
      - name: Buddy System — integration pairing
        run: node scripts/governance/verify-integration-pairing.js
      - name: Perception Check — behavioral pairing
        run: node scripts/governance/verify-behavioral-pairing.js
      - name: Security Critical Gate
        run: node scripts/governance/check-security-critical.js
      - name: Dependency Health — circular deps
        run: node scripts/governance/check-circular-deps.js
      - name: DRY — duplicate code
        run: node scripts/governance/check-duplicate-code.js
      - name: Schema Validation — boundaries
        run: node scripts/governance/check-zod-boundaries.js
      - name: SRP Guardrails
        run: node scripts/governance/guardrails-check.js
      - name: Code Health — orphans
        run: node scripts/governance/code-health-check.js
      - name: Test Discipline — skipped tests
        run: node scripts/governance/check-skipped-tests.js
      - name: Mutation Score (stub)
        run: node scripts/governance/check-mutation-score.js
      - name: Coverage Fortress
        run: node scripts/governance/check-per-file-baseline.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
