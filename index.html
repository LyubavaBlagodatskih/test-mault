<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>

        <form id="todo-form" class="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="Добавить новую задачу..."
                autocomplete="off"
                required
            >
            <button type="submit">Добавить</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="footer">
            <span id="count">0 задач</span>
            <button id="clear-completed" class="clear-btn">Очистить выполненные</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
